<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatsApp Template Studio</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Dev-only: surface uncaught render errors for debugging.
      window.__caught = [];
      window.addEventListener('error', (e) => window.__caught.push(String((e.error && e.error.stack) || e.message)));
    </script>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
