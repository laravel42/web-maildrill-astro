allowBuilds:
  esbuild: true
  sharp: true
# eslint-plugin-jsx-a11y@6.10.2 (its latest) hasn't widened its `eslint` peer
# range to include v10, but eslint-plugin-astro@3 requires exactly this pairing
# and it lints cleanly against ESLint 10. Declare the combination allowed.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-jsx-a11y>eslint: '10'
