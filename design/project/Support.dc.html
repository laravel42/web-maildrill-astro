<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./support.js"></script>
    <meta name="ext-resource-dependency" content="./md-motion.js" data-resource-id="mdmotion" />
    <template id="__bundler_thumbnail"
      ><svg
        xmlns="http://www.w3.org/2000/svg"
        width="1200"
        height="630"
        viewBox="0 0 1200 630"
        data-bg-color="#f6f5f2"
      >
        <rect width="1200" height="630" fill="#f6f5f2" />
        <g transform="translate(566,232) scale(3.4)">
          <path
            fill="#ff441f"
            d="M13.39,0c-2.86,2.06-5.61,4-8.47,6.06C3.89,4,2.86,2.06,1.95,0h11.44Z"
          />
          <path
            fill="#ff441f"
            d="M19.57,17.49c-1.49,3.09-3.09,6.17-4.58,9.26-.69-1.49-1.49-2.97-2.17-4.34l6.75-4.92Z"
          />
          <path
            fill="#ff441f"
            d="M26.32,0c-6.07,4.23-12.02,8.58-18.08,12.81-.8-1.6-1.6-3.2-2.4-4.92,3.66-2.63,7.44-5.26,11.1-7.89h9.38Z"
          />
          <path
            fill="#ff441f"
            d="M27.12,2.17c-1.83,3.66-3.66,7.32-5.49,10.98-3.2,2.29-6.52,4.57-9.73,6.86l-2.63-5.15c5.95-4.23,11.9-8.46,17.85-12.69Z"
          />
        </g>
        <text
          x="600"
          y="440"
          font-family="Geist,system-ui,sans-serif"
          font-size="56"
          font-weight="800"
          fill="#1f1e1b"
          text-anchor="middle"
          letter-spacing="-3"
        >
          Maildrill
        </text>
      </svg></template
    >
  </head>
  <body>
    <x-dc>
      <helmet>
        <title>Support — Maildrill help center</title>
        <meta
          name="description"
          content="Get help with Maildrill: browse help topics on getting started, deliverability, channels, billing, and the API, find popular answers, or reach our support team."
        />
        <meta
          name="keywords"
          content="Maildrill support, help center, messaging help, deliverability help, billing support, API support"
        />
        <meta property="og:title" content="Maildrill Support — help center" />
        <meta
          property="og:description"
          content="Browse help topics, popular answers, and ways to reach the Maildrill team."
        />
        <meta name="twitter:card" content="summary_large_image" />
        <link rel="canonical" href="https://maildrill.com/support" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
          href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500&display=swap"
          rel="stylesheet"
        />
        <style>
          @keyframes md-blob {
            0%,
            100% {
              border-radius: 60% 40% 55% 45%/50% 55% 45% 50%;
            }
            50% {
              border-radius: 45% 55% 40% 60%/55% 45% 60% 40%;
            }
          }
          @keyframes md-drift {
            0%,
            100% {
              transform: translate(0, 0);
            }
            50% {
              transform: translate(8px, -10px);
            }
          }
          body {
            margin: 0;
          }
          * {
            cursor: none;
          }
          @media (pointer: coarse) {
            * {
              cursor: auto;
            }
          }
          a {
            color: #4f46e5;
          }
          a:hover {
            color: #4338ca;
          }
          .md-mono {
            font-family: 'Geist Mono', ui-monospace, monospace;
          }
          .sp-cat:hover .sp-arrow {
            opacity: 1;
            transform: translate(4px, -4px);
          }
          .sp-art:hover {
            background: #fbfaf8;
          }
          .sp-art:hover .sp-art-arrow {
            opacity: 1;
            transform: translate(4px, 0);
          }
        </style>
      </helmet>
      <div
        style="
          font-family: Geist, system-ui, sans-serif;
          background: #f6f5f2;
          color: #1f1e1b;
          overflow-x: hidden;
        "
      >
        <dc-import name="MaildrillNav" active="none" hint-size="100%,72px"></dc-import>

        <!-- HERO -->
        <section
          style="
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #201d16, #15130d);
          "
        >
          <div
            style="
              position: absolute;
              top: -80px;
              right: 8%;
              width: 360px;
              height: 360px;
              background: radial-gradient(circle, rgba(99, 91, 245, 0.26), transparent 65%);
              animation: md-blob 14s ease-in-out infinite;
              pointer-events: none;
            "
          ></div>
          <div
            style="
              position: absolute;
              bottom: -100px;
              left: 4%;
              width: 340px;
              height: 340px;
              background: radial-gradient(circle, rgba(255, 68, 31, 0.2), transparent 65%);
              animation: md-drift 12s ease-in-out infinite;
              pointer-events: none;
            "
          ></div>
          <div
            style="
              position: relative;
              max-width: 820px;
              margin: 0 auto;
              padding: 72px 32px 64px;
              text-align: center;
            "
          >
            <div
              class="md-mono"
              data-reveal
              style="
                opacity: 0;
                transform: translateY(14px);
                transition: all 0.6s;
                font-size: 13px;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                color: #a5a39a;
              "
            >
              / Support
            </div>
            <h1
              data-split
              style="
                opacity: 0;
                font-size: clamp(40px, 5.6vw, 80px);
                line-height: 1;
                letter-spacing: -0.04em;
                font-weight: 800;
                margin: 16px 0 0;
                color: #f5f3ec;
              "
            >
              How can we help?
            </h1>
            <form
              onSubmit="{{ onSearch }}"
              data-reveal
              data-delay="140"
              style="
                opacity: 0;
                transform: translateY(16px);
                transition: all 0.6s;
                display: flex;
                align-items: center;
                gap: 10px;
                max-width: 560px;
                margin: 28px auto 0;
                background: #fff;
                border-radius: 14px;
                padding: 8px 8px 8px 18px;
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
              "
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#a5a39a"
                stroke-width="2"
                stroke-linecap="round"
              >
                <circle cx="11" cy="11" r="7" />
                <path d="m21 21-4.3-4.3" />
              </svg>
              <input
                type="search"
                placeholder="Search help articles…"
                style="
                  flex: 1;
                  border: none;
                  outline: none;
                  font-size: 16px;
                  font-family: inherit;
                  background: transparent;
                  color: #1f1e1b;
                "
              />
              <button
                type="submit"
                style="
                  padding: 11px 20px;
                  border: none;
                  border-radius: 10px;
                  background: #4f46e5;
                  color: #fff;
                  font-size: 14px;
                  font-weight: 600;
                  font-family: inherit;
                  cursor: pointer;
                  transition: background 0.2s;
                "
                style-hover="background:#4338ca"
              >
                Search
              </button>
            </form>
            <div
              data-reveal
              data-delay="200"
              style="
                opacity: 0;
                transition: all 0.6s;
                font-size: 13px;
                color: #a5a39a;
                margin-top: 16px;
              "
            >
              Popular: <a href="GuideArticle.dc.html" style="color: #c0beb4">domain setup</a> ·
              <a href="Pricing.dc.html" style="color: #c0beb4">billing</a> ·
              <a href="ApiDocs.dc.html" style="color: #c0beb4">API keys</a>
            </div>
          </div>
        </section>

        <!-- CATEGORIES -->
        <section style="max-width: 1280px; margin: 0 auto; padding: 64px 32px 32px">
          <div
            class="md-mono"
            data-reveal
            style="
              opacity: 0;
              transform: translateY(14px);
              transition: all 0.6s;
              font-size: 13px;
              letter-spacing: 0.14em;
              text-transform: uppercase;
              color: #77756c;
            "
          >
            / Browse topics
          </div>
          <h2
            data-split
            style="
              opacity: 0;
              font-size: clamp(28px, 3.6vw, 44px);
              line-height: 1.05;
              letter-spacing: -0.03em;
              font-weight: 800;
              margin: 14px 0 32px;
            "
          >
            Find your way around.
          </h2>
          <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px">
            <sc-for list="{{ cats }}" as="c" hint-placeholder-count="6">
              <a
                href="{{ c.href }}"
                class="sp-cat"
                data-card
                data-reveal
                data-delay="{{ c.delay }}"
                style="
                  opacity: 0;
                  transform: translateY(24px);
                  transition: all 0.7s cubic-bezier(0.2, 0.7, 0.2, 1);
                  background: #fff;
                  border: 1px solid #ecebe6;
                  border-radius: 18px;
                  padding: 26px;
                  text-decoration: none;
                  color: inherit;
                  display: flex;
                  flex-direction: column;
                "
              >
                <div
                  style="
                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                    margin-bottom: 16px;
                  "
                >
                  <span
                    style="width:44px;height:44px;border-radius:11px;background:{{ c.tint }};color:{{ c.color }};display:flex;align-items:center;justify-content:center"
                    data-icon="{{ c.icon }}"
                  ></span>
                  <span
                    class="sp-arrow"
                    style="color: #1f1e1b; opacity: 0.3; transition: all 0.3s"
                    data-icon="arrowUpRight"
                  ></span>
                </div>
                <h3
                  style="
                    font-size: 18px;
                    font-weight: 600;
                    letter-spacing: -0.01em;
                    margin: 0 0 6px;
                  "
                >
                  {{ c.title }}
                </h3>
                <p
                  style="
                    font-size: 14px;
                    line-height: 1.55;
                    color: #57554e;
                    margin: 0 0 12px;
                    flex: 1;
                  "
                >
                  {{ c.desc }}
                </p>
                <span class="md-mono" style="font-size: 12px; color: #a5a39a"
                  >{{ c.count }} articles</span
                >
              </a>
            </sc-for>
          </div>
        </section>

        <!-- POPULAR + CONTACT -->
        <section
          style="
            max-width: 1280px;
            margin: 0 auto;
            padding: 40px 32px 40px;
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 40px;
            align-items: start;
          "
        >
          <div>
            <div
              class="md-mono"
              data-reveal
              style="
                opacity: 0;
                transform: translateY(14px);
                transition: all 0.6s;
                font-size: 13px;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                color: #77756c;
              "
            >
              / Popular articles
            </div>
            <div
              data-reveal
              data-delay="60"
              style="
                opacity: 0;
                transition: all 0.6s;
                margin-top: 20px;
                border: 1px solid #ecebe6;
                border-radius: 16px;
                overflow: hidden;
                background: #fff;
              "
            >
              <sc-for list="{{ popular }}" as="a" hint-placeholder-count="6">
                <a
                  href="{{ a.href }}"
                  class="sp-art"
                  style="
                    display: flex;
                    align-items: center;
                    gap: 14px;
                    padding: 16px 20px;
                    border-top: 1px solid #f3f2ee;
                    text-decoration: none;
                    color: inherit;
                    transition: background 0.15s;
                  "
                >
                  <span
                    style="width:30px;height:30px;border-radius:8px;background:{{ a.tint }};color:{{ a.color }};display:flex;align-items:center;justify-content:center;flex-shrink:0"
                    data-icon="{{ a.icon }}"
                  ></span>
                  <span style="flex: 1; font-size: 15px; font-weight: 500; color: #1f1e1b"
                    >{{ a.title }}</span
                  >
                  <span
                    class="sp-art-arrow"
                    style="color: #a5a39a; opacity: 0.4; transition: all 0.3s"
                    data-icon="arrow"
                  ></span>
                </a>
              </sc-for>
            </div>
          </div>
          <div>
            <div
              class="md-mono"
              data-reveal
              style="
                opacity: 0;
                transform: translateY(14px);
                transition: all 0.6s;
                font-size: 13px;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                color: #77756c;
              "
            >
              / Still stuck?
            </div>
            <div style="display: flex; flex-direction: column; gap: 14px; margin-top: 20px">
              <sc-for list="{{ channels }}" as="c" hint-placeholder-count="3">
                <a
                  href="{{ c.href }}"
                  data-card
                  data-reveal
                  data-delay="{{ c.delay }}"
                  style="
                    opacity: 0;
                    transform: translateY(18px);
                    transition: all 0.6s;
                    display: flex;
                    gap: 14px;
                    align-items: flex-start;
                    background: #fff;
                    border: 1px solid #ecebe6;
                    border-radius: 14px;
                    padding: 18px 20px;
                    text-decoration: none;
                    color: inherit;
                  "
                >
                  <span
                    style="width:38px;height:38px;flex-shrink:0;border-radius:10px;background:{{ c.tint }};color:{{ c.color }};display:flex;align-items:center;justify-content:center"
                    data-icon="{{ c.icon }}"
                  ></span>
                  <span
                    ><span style="display: block; font-size: 15px; font-weight: 600"
                      >{{ c.title }}</span
                    ><span
                      style="
                        display: block;
                        font-size: 13px;
                        color: #57554e;
                        line-height: 1.45;
                        margin-top: 2px;
                      "
                      >{{ c.desc }}</span
                    ></span
                  >
                </a>
              </sc-for>
            </div>
          </div>
        </section>

        <dc-import name="MaildrillFooter" hint-size="100%,540px"></dc-import>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props="{}">
      class Component extends DCLogic {
        componentDidMount(){
          import(window.__resources&&window.__resources.mdmotion||'./md-motion.js').then(m=>{ requestAnimationFrame(()=>m.initMotion({cursor:true})); });
        }
        renderVals(){
          return {
            onSearch:(e)=>{ e.preventDefault(); },
            cats:[
              {icon:"bolt",title:"Getting started",desc:"Create your workspace, invite your team, and send your first campaign.",count:"14",color:"#4f46e5",tint:"#eef0ff",href:"Guides.dc.html",delay:0},
              {icon:"shield",title:"Deliverability",desc:"Domain authentication, warmup, and keeping messages out of spam.",count:"22",color:"#16a34a",tint:"#dcfce7",href:"Deliverability.dc.html",delay:80},
              {icon:"layers",title:"Channels",desc:"Set up and send across email, SMS, WhatsApp, and voice.",count:"31",color:"#0891b2",tint:"#ecfeff",href:"Product.dc.html#channels",delay:160},
              {icon:"chart",title:"Analytics",desc:"Read reports, build funnels, and compare campaign performance.",count:"12",color:"#d97706",tint:"#fef3c7",href:"Product.dc.html",delay:0},
              {icon:"code",title:"API & webhooks",desc:"Authenticate, send via the API, and stream events to your stack.",count:"18",color:"#4f46e5",tint:"#eef0ff",href:"ApiDocs.dc.html",delay:80},
              {icon:"filter",title:"Billing & account",desc:"Pay-per-use billing, prepay tiers, invoices, and account settings.",count:"9",color:"#16a34a",tint:"#dcfce7",href:"Pricing.dc.html",delay:160},
            ],
            popular:[
              {title:"How do I authenticate my sending domain?",icon:"shield",color:"#16a34a",tint:"#dcfce7",href:"GuideArticle.dc.html"},
              {title:"What counts as one billable message per channel?",icon:"filter",color:"#4f46e5",tint:"#eef0ff",href:"Pricing.dc.html"},
              {title:"How do annual prepay discounts work?",icon:"filter",color:"#16a34a",tint:"#dcfce7",href:"Pricing.dc.html"},
              {title:"Where do I find and rotate my API key?",icon:"code",color:"#0891b2",tint:"#ecfeff",href:"ApiDocs.dc.html"},
              {title:"How do I warm up a new sending domain?",icon:"bolt",color:"#4f46e5",tint:"#eef0ff",href:"Guides.dc.html"},
              {title:"Getting WhatsApp templates approved",icon:"layers",color:"#16a34a",tint:"#dcfce7",href:"ChannelWhatsApp.dc.html"},
            ],
            channels:[
              {icon:"mail",title:"Email support",desc:"Reach our team at support@maildrill.com — we reply within one business day.",color:"#4f46e5",tint:"#eef0ff",href:"mailto:support@maildrill.com",delay:0},
              {icon:"users",title:"Talk to a human",desc:"Book a call or message sales about your setup and volume.",color:"#0891b2",tint:"#ecfeff",href:"Contact.dc.html",delay:80},
              {icon:"globe",title:"System status",desc:"All systems operational. Subscribe for incident updates.",color:"#16a34a",tint:"#dcfce7",href:"#",delay:160},
            ],
          };
        }
      }
    </script>
  </body>
</html>
