<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
.md-submenu{opacity:0;transform:translate(-50%,10px);pointer-events:none;transition:opacity .22s cubic-bezier(.2,.7,.2,1),transform .22s cubic-bezier(.2,.7,.2,1)}
.md-hasmenu:hover .md-submenu,.md-hasmenu:focus-within .md-submenu{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.md-hasmenu:hover .md-caret{transform:rotate(180deg)}
.md-subitem:hover{background:#f6f5f2}
.md-subitem:hover .md-sub-arrow{opacity:1;transform:translate(3px,-3px)}
</style>
</helmet>
<div style="position:sticky;top:0;z-index:50;font-family:Geist,system-ui,sans-serif">
  <div style="backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);background:rgba(246,245,242,.75);border-bottom:1px solid var(--nborder,#ecebe6)">
    <nav style="max-width:1280px;margin:0 auto;height:72px;padding:0 32px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;position:relative">
      <a href="Home.dc.html" style="display:flex;align-items:center;gap:9px;text-decoration:none;flex-shrink:0" aria-label="Maildrill home">
        <svg viewBox="0 0 30 26.76" width="25" height="22" aria-hidden="true">
          <path fill="#ff441f" d="M13.39,0c-2.86,2.06-5.61,4-8.47,6.06C3.89,4,2.86,2.06,1.95,0h11.44Z"/>
          <path fill="#ff441f" d="M19.57,17.49c-1.49,3.09-3.09,6.17-4.58,9.26-.69-1.49-1.49-2.97-2.17-4.34l6.75-4.92Z"/>
          <path fill="#ff441f" d="M26.32,0c-6.07,4.23-12.02,8.58-18.08,12.81-.8-1.6-1.6-3.2-2.4-4.92,3.66-2.63,7.44-5.26,11.1-7.89h9.38Z"/>
          <path fill="#ff441f" d="M27.12,2.17c-1.83,3.66-3.66,7.32-5.49,10.98-3.2,2.29-6.52,4.57-9.73,6.86l-2.63-5.15c5.95-4.23,11.9-8.46,17.85-12.69Z"/>
        </svg>
        <span style="font-size:19px;font-weight:600;letter-spacing:-.02em;color:#1f1e1b">Mail<span style="color:#ff441f">drill</span></span>
      </a>
      <div style="display:flex;align-items:center;gap:4px;justify-self:center" data-navlinks>
        <a href="Product.dc.html" style="padding:8px 12px;border-radius:8px;font-size:14px;font-weight:500;text-decoration:none;color:{{ c_product }};transition:color .15s" style-hover="color:#ff441f">Product</a>
        <div class="md-hasmenu" style="position:relative;display:flex;align-items:center">
          <a href="Product.dc.html#channels" style="display:inline-flex;align-items:center;gap:5px;padding:8px 12px;border-radius:8px;font-size:14px;font-weight:500;text-decoration:none;color:{{ c_solutions }};transition:color .15s" style-hover="color:#ff441f">Channels<svg class="md-caret" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="transition:transform .22s;opacity:.6"><path d="m6 9 6 6 6-6"/></svg></a>
          <div class="md-submenu" style="position:absolute;left:50%;top:100%;padding-top:16px;z-index:60">
            <div style="width:320px;background:#fff;border:1px solid #ecebe6;border-radius:16px;box-shadow:0 20px 50px rgba(30,27,22,.14);padding:10px;display:flex;flex-direction:column;gap:2px">
              <sc-for list="{{ subChannels }}" as="s" hint-placeholder-count="4">
                <a href="{{ s.href }}" class="md-subitem" style="display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;text-decoration:none;transition:background .15s">
                  <span style="width:36px;height:36px;border-radius:10px;background:{{ s.tint }};color:{{ s.color }};display:flex;align-items:center;justify-content:center;flex-shrink:0" data-subicon="{{ s.icon }}"></span>
                  <span style="flex:1;min-width:0">
                    <span style="display:flex;align-items:center;gap:5px;font-size:14px;font-weight:600;color:#1f1e1b">{{ s.label }}<svg class="md-sub-arrow" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="opacity:0;transition:opacity .2s,transform .2s;color:#77756c"><path d="M7 17 17 7M8 7h9v9"/></svg></span>
                    <span style="display:block;font-size:12px;color:#77756c;margin-top:2px;line-height:1.4">{{ s.desc }}</span>
                  </span>
                </a>
              </sc-for>
            </div>
          </div>
        </div>
        <div class="md-hasmenu" style="position:relative;display:flex;align-items:center">
          <a href="Blog.dc.html" style="display:inline-flex;align-items:center;gap:5px;padding:8px 12px;border-radius:8px;font-size:14px;font-weight:500;text-decoration:none;color:{{ c_blog }};transition:color .15s" style-hover="color:#ff441f">Resources<svg class="md-caret" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="transition:transform .22s;opacity:.6"><path d="m6 9 6 6 6-6"/></svg></a>
          <div class="md-submenu" style="position:absolute;left:50%;top:100%;padding-top:16px;z-index:60">
            <div style="width:320px;background:#fff;border:1px solid #ecebe6;border-radius:16px;box-shadow:0 20px 50px rgba(30,27,22,.14);padding:10px;display:flex;flex-direction:column;gap:2px">
              <sc-for list="{{ resourceLinks }}" as="r" hint-placeholder-count="4">
                <a href="{{ r.href }}" class="md-subitem" style="display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;text-decoration:none;transition:background .15s">
                  <span style="width:34px;height:34px;border-radius:9px;background:{{ r.tint }};color:{{ r.color }};display:flex;align-items:center;justify-content:center;flex-shrink:0" data-subicon="{{ r.icon }}"></span>
                  <span style="flex:1;min-width:0">
                    <span style="display:flex;align-items:center;gap:5px;font-size:14px;font-weight:600;color:#1f1e1b">{{ r.label }}<svg class="md-sub-arrow" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="opacity:0;transition:opacity .2s,transform .2s;color:#77756c"><path d="M7 17 17 7M8 7h9v9"/></svg></span>
                    <span style="display:block;font-size:12px;color:#77756c;margin-top:2px;line-height:1.4">{{ r.desc }}</span>
                  </span>
                </a>
              </sc-for>
            </div>
          </div>
        </div>
        <a href="Pricing.dc.html" style="padding:8px 12px;border-radius:8px;font-size:14px;font-weight:500;text-decoration:none;color:{{ c_pricing }};transition:color .15s" style-hover="color:#ff441f">Pricing</a>
        <a href="Contact.dc.html" style="padding:8px 12px;border-radius:8px;font-size:14px;font-weight:500;text-decoration:none;color:{{ c_contact }};transition:color .15s" style-hover="color:#ff441f">Contact</a>
      </div>
      <div style="justify-self:end;display:flex;align-items:center;gap:8px">
        <a href="Login.dc.html" style="padding:8px 14px;border-radius:10px;font-size:14px;font-weight:500;text-decoration:none;color:#3a3833;transition:background .15s" style-hover="background:#f3f2ee">Log in</a>
        <a href="Signup.dc.html" style="position:relative;z-index:2;display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;text-decoration:none;color:#fff;background:#1f1e1b;transition:background .2s" style-hover="background:#4f46e5">
          Start free trial
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>
        </a>
      </div>
      <button onClick="{{ toggleMobile }}" aria-label="Menu" style="display:none;margin-left:auto;background:none;border:1px solid #e4e2da;border-radius:10px;width:40px;height:40px;align-items:center;justify-content:center;cursor:pointer;color:#1f1e1b" data-mobilebtn>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </nav>
  </div>
  <sc-if value="{{ mobileOpen }}" hint-placeholder-val="{{ false }}">
    <div style="background:#fff;border-bottom:1px solid #ecebe6;padding:8px 16px 16px;display:flex;flex-direction:column;gap:2px">
      <a href="Product.dc.html" style="padding:12px;border-radius:10px;font-size:15px;font-weight:500;text-decoration:none;color:#1f1e1b">Product</a>
      <a href="Product.dc.html#channels" style="padding:12px;border-radius:10px;font-size:15px;font-weight:500;text-decoration:none;color:#1f1e1b">Channels</a>
      <a href="Pricing.dc.html" style="padding:12px;border-radius:10px;font-size:15px;font-weight:500;text-decoration:none;color:#1f1e1b">Pricing</a>
      <div style="padding:12px 12px 4px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#a5a39a;font-family:'Geist Mono',ui-monospace,monospace">Resources</div>
      <a href="Blog.dc.html" style="padding:10px 12px 10px 20px;border-radius:10px;font-size:15px;font-weight:500;text-decoration:none;color:#1f1e1b">Blog</a>
      <a href="Guides.dc.html" style="padding:10px 12px 10px 20px;border-radius:10px;font-size:15px;font-weight:500;text-decoration:none;color:#1f1e1b">Guides</a>
      <a href="ApiDocs.dc.html" style="padding:10px 12px 10px 20px;border-radius:10px;font-size:15px;font-weight:500;text-decoration:none;color:#1f1e1b">API docs</a>
      <a href="Deliverability.dc.html" style="padding:10px 12px 10px 20px;border-radius:10px;font-size:15px;font-weight:500;text-decoration:none;color:#1f1e1b">Deliverability</a>
      <a href="Support.dc.html" style="padding:10px 12px 10px 20px;border-radius:10px;font-size:15px;font-weight:500;text-decoration:none;color:#1f1e1b">Support</a>
      <a href="About.dc.html" style="padding:12px;border-radius:10px;font-size:15px;font-weight:500;text-decoration:none;color:#1f1e1b">About</a>
      <a href="Contact.dc.html" style="padding:12px;border-radius:10px;font-size:15px;font-weight:500;text-decoration:none;color:#1f1e1b">Contact</a>
      <a href="Login.dc.html" style="padding:12px;border-radius:10px;font-size:15px;font-weight:500;text-decoration:none;color:#1f1e1b">Log in</a>
      <a href="Signup.dc.html" style="margin-top:6px;text-align:center;padding:12px;border-radius:10px;font-size:15px;font-weight:600;text-decoration:none;color:#fff;background:#4f46e5">Start free trial</a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:140},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;product&quot;,&quot;solutions&quot;,&quot;pricing&quot;,&quot;blog&quot;,&quot;about&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { mobileOpen: false };
  SUBICONS = {
    mail:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>',
    sms:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/></svg>',
    whatsapp:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15l-1.3 4.8 4.9-1.3A10 10 0 1 0 12 2Zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-2.9.8.8-2.8-.2-.3A8 8 0 1 1 12 20Z"/></svg>',
    voice:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/></svg>',
    blog:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h11a2 2 0 0 1 2 2v14l-4-2-4 2-4-2V4Z"/><path d="M17 6h3v12a2 2 0 0 1-2 2M8 8h5M8 12h5"/></svg>',
    guides:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2Z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7Z"/></svg>',
    code:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></svg>',
    shield:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/></svg>',
    help:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>',
  };
  componentDidMount(){
    document.querySelectorAll('[data-subicon]').forEach(n=>{ if(!n.__si){ n.innerHTML=this.SUBICONS[n.getAttribute('data-subicon')]||''; n.__si=1; } });
  }
  renderVals() {
    const active = this.props.active || "";
    const on = "#ff441f", off = "#57554e";
    return {
      c_product: active === "product" ? on : off,
      c_solutions: active === "solutions" ? on : off,
      c_pricing: active === "pricing" ? on : off,
      c_blog: active === "blog" ? on : off,
      c_about: active === "about" ? on : off,
      c_contact: active === "contact" ? on : off,
      subChannels:[
        {label:"Email",icon:"mail",color:"#4f46e5",tint:"#eef0ff",href:"ChannelEmail.dc.html",desc:"Inbox-ready campaigns & builder"},
        {label:"SMS",icon:"sms",color:"#0891b2",tint:"#ecfeff",href:"ChannelSMS.dc.html",desc:"Two-way texting, instant reach"},
        {label:"WhatsApp",icon:"whatsapp",color:"#16a34a",tint:"#dcfce7",href:"ChannelWhatsApp.dc.html",desc:"Rich Business API conversations"},
        {label:"Voice",icon:"voice",color:"#d97706",tint:"#fef3c7",href:"ChannelVoice.dc.html",desc:"Automated calls & IVR flows"},
      ],
      resourceLinks:[
        {label:"Blog",icon:"blog",color:"#4f46e5",tint:"#eef0ff",href:"Blog.dc.html",desc:"News, product updates & tactics"},
        {label:"Guides",icon:"guides",color:"#16a34a",tint:"#dcfce7",href:"Guides.dc.html",desc:"Step-by-step playbooks"},
        {label:"API docs",icon:"code",color:"#0891b2",tint:"#ecfeff",href:"ApiDocs.dc.html",desc:"REST API, SDKs & webhooks"},
        {label:"Deliverability",icon:"shield",color:"#d97706",tint:"#fef3c7",href:"Deliverability.dc.html",desc:"Inbox placement & authentication"},
        {label:"Support",icon:"help",color:"#4f46e5",tint:"#eef0ff",href:"Support.dc.html",desc:"Help center & contact options"},
      ],
      mobileOpen: this.state.mobileOpen,
      toggleMobile: () => this.setState(s => ({ mobileOpen: !s.mobileOpen })),
    };
  }
}
</script>
</body>
</html>
